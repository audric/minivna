[package]
name = "minivna"
version = "0.1.0"
edition = "2021"
description = "Desktop program for the mRS miniVNA antenna analyser"

[lib]
name = "minivna"
path = "src/lib.rs"

[[bin]]
name = "minivna"
path = "src/main.rs"

[dependencies]
directories = "6.0.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serialport = "4.10.1"
thiserror = "2.0.21"
toml = "1.2.1"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
