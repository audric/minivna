[package]
name = "minivna"
version = "0.1.0"
edition = "2021"
description = "Desktop program for the mRS miniVNA antenna analyser"

[lib]
name = "minivna"
path = "src/lib.rs"

[[bin]]
name = "minivna"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
